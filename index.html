<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & LAYOUT --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #03030a; /* Deep Dark Background */
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* --- CONTAINER --- */
        .container {
            position: relative;
            text-align: center;
            z-index: 1;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 20px;
            
            /* The Gradient Text Effect */
            background: linear-gradient(135deg, #fff 10%, #00d2ff 50%, #ff0099 90%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Subtle glow behind the text */
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.3));
            animation: breathe 4s ease-in-out infinite;
        }

        p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            font-weight: 300;
            margin-top: 10px;
        }

        /* --- SPARKLES (STARS) --- */
        .sparkles-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 150%;
            pointer-events: none; /* Let clicks pass through */
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            opacity: 0;
            /* Create the 4-point star shape */
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 10px 2px white;
            animation: twinkle 2s infinite ease-in-out;
        }

        /* Manually positioning sparkles around the text */
        .s1 { top: 10%; left: 20%; animation-delay: 0s; background-color: #00d2ff; transform: scale(1.5); }
        .s2 { top: 20%; right: 15%; animation-delay: 0.5s; background-color: #ff0099; }
        .s3 { bottom: 15%; left: 25%; animation-delay: 1.2s; background-color: white; }
        .s4 { bottom: 30%; right: 25%; animation-delay: 0.8s; background-color: #00d2ff; transform: scale(1.2); }
        .s5 { top: -10%; left: 50%; animation-delay: 1.5s; background-color: #ff0099; }
        .s6 { bottom: -5%; left: 10%; animation-delay: 2.1s; background-color: white; }
        .s7 { top: 40%; left: -5%; animation-delay: 0.3s; background-color: #00d2ff; }
        .s8 { top: 60%; right: -10%; animation-delay: 1.8s; background-color: #ff0099; }

        /* --- ANIMATIONS --- */
        
        /* Text subtle movement */
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.3)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 25px rgba(255, 0, 153, 0.4)); }
        }

        /* Sparkle flash */
        @keyframes twinkle {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(45deg); opacity: 1; box-shadow: 0 0 10px 2px currentColor; }
            100% { transform: scale(0) rotate(90deg); opacity: 0; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sparkles-container">
            <div class="sparkle s1"></div>
            <div class="sparkle s2"></div>
            <div class="sparkle s3"></div>
            <div class="sparkle s4"></div>
            <div class="sparkle s5"></div>
            <div class="sparkle s6"></div>
            <div class="sparkle s7"></div>
            <div class="sparkle s8"></div>
        </div>

        <h1>Coming Soon</h1>
        <p>WE ARE CRAFTING SOMETHING UNIQUE</p>
    </div>

</body>
</html>
